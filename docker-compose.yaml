x-custom:
  etcd_initial_cluster_token: &etcd_initial_cluster_token "--initial-cluster-token=etcd-cluster"
  etcd_common_settings: &etcd_common_settings
    image: "${ETCD_REGISTRY:-quay.io}/${ETCD_NAMESPACE:-coreos}/etcd:${ETCD_VERSION:-v3.5.10}"
    entrypoint: /usr/local/bin/etcd
  greptimedb_image: &greptimedb_image "localhost:5001/nightly-greptimedb:latest"

services:
  etcd0:
    <<: *etcd_common_settings
    container_name: etcd0
    command:
      - --name=etcd0
      - --data-dir=/var/lib/etcd
      - --initial-advertise-peer-urls=http://etcd0:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd0:2379
      - --heartbeat-interval=250
      - --election-timeout=1250
      - --initial-cluster=etcd0=http://etcd0:2380
      - --initial-cluster-state=new
      - *etcd_initial_cluster_token
    volumes:
      - /tmp/greptimedb-cluster-docker-compose/etcd0:/var/lib/etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "--endpoints=http://etcd0:2379", "endpoint", "health" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - greptimedb

  metasrv:
    image: *greptimedb_image
    container_name: metasrv
    command:
      - metasrv
      - start
      - --bind-addr=0.0.0.0:3002
      - --server-addr=metasrv:3002
      - --store-addrs=etcd0:2379
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://metasrv:3002/admin/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      etcd0:
        condition: service_healthy
    networks:
      - greptimedb

  datanode0:
    image: *greptimedb_image
    container_name: datanode0
    command:
      - datanode
      - start
      - --node-id=0
      - --rpc-addr=0.0.0.0:3001
      - --rpc-hostname=datanode0:3001
      - --metasrv-addrs=metasrv:3002
      - --http-addr=0.0.0.0:5000
    volumes:
      - /tmp/greptimedb-cluster-docker-compose/datanode0:/tmp/greptimedb
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://datanode0:5000/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      metasrv:
        condition: service_healthy
    networks:
      - greptimedb

  frontend0:
    image: *greptimedb_image
    container_name: frontend0
    ports:
      - 19195:4002 # for insert using mysql protocol
      - 19196:4003 # for insert using psql protocol
    command:
      - frontend
      - start
      - --metasrv-addrs=metasrv:3002
      - --http-addr=0.0.0.0:4000
      - --rpc-addr=0.0.0.0:4001
      - --mysql-addr=0.0.0.0:4002
      - --postgres-addr=0.0.0.0:4003
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://frontend0:4000/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      datanode0:
        condition: service_healthy
    networks:
      - greptimedb

  flownode0:
    image: *greptimedb_image
    container_name: flownode0
    ports:
      - 6666:5001 # for manual health check
    command:
      - flownode
      - start
      - --node-id=0
      - --metasrv-addrs=metasrv:3002
      - --rpc-addr=0.0.0.0:4004
      - --rpc-hostname=flownode0:4004
      - --http-addr=0.0.0.0:5001
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://flownode0:5001/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      frontend0:
        condition: service_healthy
    networks:
      - greptimedb
  
  standalone:
    image: *greptimedb_image
    container_name: standalone
    command:
      - standalone
      - start
      - --http-addr=0.0.0.0:14514
    volumes:
      - /tmp/greptimedb-cluster-docker-compose/standalone:/tmp/greptimedb
    networks:
      - greptimedb

  prometheus:
    image: prom/prometheus
    container_name: prom
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - --storage.tsdb.retention.time=90d
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    networks:
      - greptimedb

  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    restart: always
    ports:
      - 15020:3000 # for grafana view metrics
    networks:
      - greptimedb
    volumes:
      - grafana-storage:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: bench20220411

networks:
  greptimedb:
    name: greptimedb

volumes:
  prometheus-data:
  grafana-storage:
